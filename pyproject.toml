[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taylorswift-spectra"
version = "0.2.2"
description = "FFT-based (co)spectral analysis for eddy covariance time series"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Paul Inkenbrandt", email = "paulinkenbrandt@utah.gov" },
]
requires-python = ">=3.10"
keywords = ["eddy covariance", "micrometeorology", "turbulence", "spectra", "flux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "polars>=1.0",
    "pandas>=1.5",
    "pyarrow",
    "KDEpy>=1.1",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-benchmark>=4.0",
    "ruff>=0.8",
    "mypy>=1.13",
]
docs = [
    # Upper bounds are deliberate. MkDocs 2.0 removes the plugin system that
    # mkdocstrings and mkdocs-material both depend on, and Read the Docs
    # resolves this extra fresh on every build, so an unbounded range would
    # break the docs build the day 2.0 ships.
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.24,<3",
    "pymdown-extensions>=10.0",
]

# Interactive examples are separate from test and documentation tooling.
notebooks = ["notebook>=6.0", "ipykernel>=6.0"]

[project.urls]
Homepage = "https://github.com/inkenbrandt/TaylorSwift"
Repository = "https://github.com/inkenbrandt/TaylorSwift"
Issues = "https://github.com/inkenbrandt/TaylorSwift/issues"

[tool.setuptools]
packages = ["TaylorSwift"]

[tool.setuptools.package-dir]
TaylorSwift = "src/TaylorSwift"

[tool.setuptools.package-data]
TaylorSwift = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/TaylorSwift"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E4",  # imports
    "E7",  # statement style
    "E9",  # runtime errors
    "F",   # pyflakes
    "W",   # whitespace
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "NPY", # numpy rules
]

[tool.ruff.lint.per-file-ignores]
# Re-export hub: unused imports are the backward-compatible API surface.
"src/TaylorSwift/cospectra.py" = ["F401"]

[tool.mypy]
# Analysis version 3.12: NumPy 2.x ships stubs using `type` statements that
# mypy only accepts from 3.12 up. The package itself still supports 3.10.
python_version = "3.12"
files = ["src/TaylorSwift"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "statsmodels.*",
    "KDEpy.*",
    "matplotlib.*",
    "pandas.*",
    "pyarrow.*",
]
ignore_missing_imports = true

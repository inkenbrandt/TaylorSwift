name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"

      - name: Install locked development dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --extra dev

      - name: Run tests with coverage
        run: uv run --locked pytest --cov=TaylorSwift --cov-report=term-missing --cov-report=xml --junitxml=junit.xml

      - name: Test uncaptured Windows console output
        if: runner.os == 'Windows'
        env:
          PYTHONIOENCODING: cp1252:strict
          PYTHONUTF8: "0"
        run: uv run --locked python -m pytest tests/test_io.py -s

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
        
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml

      - name: Retain test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            junit.xml
            coverage.xml

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"

      - run: uv sync --locked --python 3.12 --extra dev

      # Runs the Phase 1 benchmark suite so performance-critical paths are
      # exercised on every push and the numbers are visible in the job log.
      # Shared-runner timings are too noisy to gate on, so this job reports
      # rather than fails; compare locally with --benchmark-compare.
      - name: Run benchmarks
        run: uv run --locked pytest benchmarks --benchmark-only --benchmark-columns=mean,stddev,rounds

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - run: uv sync --locked --python 3.12 --extra dev

      - name: Run ruff check
        run: uv run --locked ruff check src/ tests/ benchmarks/ tools/

  packaging:
    name: Types and installed wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
      - name: Check lock without updating it
        run: uv lock --check
      - run: uv sync --locked --python 3.12 --extra dev
      - name: Check package typing
        run: uv run --locked mypy
      - name: Build sdist and wheel
        run: uv build
      - name: Check isolated wheel and consumer typing
        run: uv run --locked python tools/check_wheel.py

  docs:
    name: Docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the interpreter Read the Docs builds with.
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"

      - run: uv sync --locked --python 3.12 --extra docs

      # --strict is the local equivalent of fail_on_warning in
      # .readthedocs.yaml, so docs breakage surfaces here rather than on RTD.
      - name: Build documentation
        run: uv run --locked mkdocs build --strict
